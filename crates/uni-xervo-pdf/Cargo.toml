[package]
name = "uni-xervo-pdf"
description = "Tiered PDF document extraction (native text -> OCR -> doc-VLM) for uni-xervo"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["pdf", "ocr", "document-extraction", "machine-learning", "inference"]
categories = ["multimedia", "text-processing"]
readme = "README.md"

[features]
# Heavy, target-specific dependencies (rasterizer backends, native PDF text
# parsing) are gated and additive — each feature only *adds* capability, per
# M-FEATURES-ADDITIVE.
default = ["pdf-input", "hayro"]
# Native PDF text-layer extraction (the `Native` tier) via pure-Rust `lopdf`.
pdf-input = ["dep:lopdf"]
# Pure-Rust PDF page rasterization (the default rasterizer backend).
hayro = ["dep:hayro", "dep:image"]

[dependencies]
# Sibling crate in the uni-xervo umbrella. The workspace dep sets
# `default-features = false` (the bundled inference providers are off): this
# crate only needs the always-present runtime, traits, and types. Consumers
# enable providers on `uni-xervo` itself.
uni-xervo = { workspace = true }
async-trait = { workspace = true }
tracing = { workspace = true }

# Pure-Rust PDF parsing for the native text tier. Optional, behind `pdf-input`.
lopdf = { version = "0.46", optional = true }

# Pure-Rust PDF rasterizer (behind `hayro`); `image` encodes the rendered page.
hayro = { version = "0.8", optional = true }
image = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true }
# Examples and cross-crate integration tests drive the real OCR rung, so they
# turn on `uni-xervo`'s ONNX provider (the library dep keeps providers off).
# Dev-dep features don't propagate to downstream consumers; Cargo unifies this
# with the normal `default-features = false` dep for the test/example build only.
uni-xervo = { workspace = true, features = ["provider-onnx"] }
# Decode rasterized page PNGs in tests without a model download.
image = { workspace = true }
# Build model-alias options inline in examples/tests.
serde_json = "1"
# Generate a minimal text PDF inline (mirrors the in-crate `testutil` helper,
# which is `#[cfg(test)] pub(crate)` and so unreachable from integration tests).
lopdf = "0.46"
