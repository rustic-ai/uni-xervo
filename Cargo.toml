# Virtual workspace root for the uni-xervo project.
#
# Members live under `crates/`. Shared package metadata is defined once in
# `[workspace.package]` and inherited via `field.workspace = true`; commonly
# shared dependencies live in `[workspace.dependencies]`.
[workspace]
members = ["crates/uni-xervo", "crates/uni-xervo-pdf"]
resolver = "2"

[workspace.package]
version = "0.18.0"
edition = "2024"
rust-version = "1.88"
authors = ["Dragonscale Industries Inc. <dev@dragonscale.ai>"]
license = "Apache-2.0"
repository = "https://github.com/rustic-ai/uni-xervo"
homepage = "https://www.rustic.ai"
documentation = "https://rustic-ai.github.io/uni-xervo"
keywords = ["machine-learning", "embeddings", "reranking", "inference", "runtime"]
categories = ["api-bindings", "asynchronous"]

[workspace.dependencies]
# Internal crate (path + version so the companion can depend on it by workspace).
uni-xervo = { path = "crates/uni-xervo", version = "0.18.0", default-features = false }
# Dependencies shared across both crates.
async-trait = "0.1"
tracing = "0.1"
tokio = { version = "1", features = ["full"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
